<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-30 -10 1110 1110" width="2048" height="2048" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="underglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#23903f" stop-opacity=".8"/>
      <stop offset="0.5" stop-color="#16602c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0a0c0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sideglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.75" stop-color="#18622d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a0c0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="squircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080909"/>
      <stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <radialGradient id="lip" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffa72b"/>
      <stop offset="0.6" stop-color="#f0701c"/>
      <stop offset="1" stop-color="#d9481a"/>
    </radialGradient>
    <filter id="glowLime" filterUnits="userSpaceOnUse" x="-30" y="-10" width="1110" height="1110">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" filterUnits="userSpaceOnUse" x="-30" y="-10" width="1110" height="1110">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-30" y="-10" width="1110" height="1110">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="blurBig" filterUnits="userSpaceOnUse" x="-30" y="-10" width="1110" height="1110">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <g id="dollar">
      <path d="M68 -45 C68 -105 -68 -105 -68 -45 C-68 5 68 -5 68 45 C68 105 -68 105 -68 45" fill="none" stroke="#a6e80a" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 -164 L15 -122 L15 122 L0 164 L-15 122 L-15 -122 Z" fill="#a6e80a"/>
    </g>
  </defs>

  <rect x="-30" y="-10" width="1110" height="1110" fill="#0a0c0b"/>

  <!-- green glow under / around the icon -->
  <ellipse cx="530" cy="975" rx="560" ry="150" fill="url(#underglow)"/>
  <ellipse cx="532" cy="520" rx="540" ry="520" fill="url(#sideglow)"/>

  <!-- rounded-square body -->
  <rect x="75" y="50" width="915" height="935" rx="260" fill="url(#squircle)"/>
  <!-- inner circular face -->
  <circle cx="525" cy="505" r="432" fill="#090a0a" stroke="#040505" stroke-width="8"/>

  <!-- mouth band -->
  <path d="M165 550 H890" stroke="#040404" stroke-width="7" stroke-linecap="round"/>
  <rect x="235" y="556" width="590" height="84" rx="22" fill="#050606" opacity=".75"/>

  <!-- dollar eyes -->
  <g filter="url(#glowLime)">
    <use xlink:href="#dollar" href="#dollar" transform="translate(367 330) scale(0.98)"/>
    <use xlink:href="#dollar" href="#dollar" transform="translate(686 330) scale(0.98)"/>
  </g>

  <!-- orange lip -->
  <g filter="url(#soft)">
    <path d="M325 672 Q520 656 720 672 Q690 752 520 756 Q360 752 325 672 Z" fill="url(#lip)"/>
    <path d="M250 676 Q330 745 442 770" fill="none" stroke="#f0621b" stroke-width="12" stroke-linecap="round" opacity=".9"/>
    <path d="M400 781 Q500 786 586 775" fill="none" stroke="#e05a18" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- cyan smile arc (tapered) -->
  <path d="M940 552 C962 740 790 930 556 940 L553 926 C772 912 925 720 940 552 Z" fill="#00e5ff" filter="url(#glowCyan)"/>
</svg>
